{
    "optimistic_loop": true,
    "loop_iter": 2,
    "server": "prover",
    "prover_version": "master",
        "rule": [
        "*validators_integrity*can_add_correct",
        "*validators_integrity*can_remove_correct",
        "*validators_integrity*add_at_most_one",
        "*validators_integrity*no_inactive_stake_after_refresh",
        "*validators_integrity*no_empty_validators_after_refresh"
    ],
    "msg": "Validator management integrity",
    "prover_args": [
        "-maxConcurrentTransforms SIMPLIFIED:1,UNROLL:1,DSA:1",
        "-disabledTransformations HOIST_LOOPS",
        "-maxMergedBranchSize 1000000",
        "-maxCommandCount 10000000",
        "-maxBlockCount 1000000",
        "-tacDumpsWithInternalFunctions true",
        "-callTraceVecElemCount 0",
        "-dumpCodeSizeAnalysis true"
    ]
}