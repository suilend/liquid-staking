{
    "optimistic_loop": true, // Cannot be pessimistic because there are internal loops that are not bounded
    "loop_iter": 6, // one more than the upper bound, munged to 5,
    "rule_sanity": "none", // vacuity checks tend to time out for this rule
    "server": "prover",
    "prover_version": "master",
        "rule": [
        "*validators_consistency*validators_upper_bound*"
    ],
    "msg": "Validators' consistency: List is upper bounded",
    "prover_args": [
        "-maxConcurrentTransforms SIMPLIFIED:1,UNROLL:1,DSA:1",
        "-disabledTransformations HOIST_LOOPS",
        "-maxMergedBranchSize 1000000",
        "-maxCommandCount 10000000",
        "-maxBlockCount 1000000",
        "-tacDumpsWithInternalFunctions true",
        "-callTraceVecElemCount 0",
        "-dumpCodeSizeAnalysis true"
    ]
}