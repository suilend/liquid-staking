{
    "optimistic_loop": true,
    "server": "prover",
    "prover_version": "master",
    "rule": [
        "*only_minting_increases_sui_supply",
        "*only_minting_increases_lst_supply"
    ],
     "method" : [
        "spec::dummy::redeem",
        "spec::dummy::collect_fees"
    ],
    "msg": "Supply control - increase rules (II)",

    "prover_args": [
        "-maxConcurrentTransforms SIMPLIFIED:1,UNROLL:1,DSA:1",
        "-disabledTransformations HOIST_LOOPS",
        "-maxMergedBranchSize 1000000",
        "-maxCommandCount 10000000",
        "-maxBlockCount 1000000",
        "-tacDumpsWithInternalFunctions true",
        "-callTraceVecElemCount 0",
        "-dumpCodeSizeAnalysis true",
        "-oldSplitParallel",
        "true",
        "-dontStopAtFirstSplitTimeout",
        "true",
        "-splitParallelTimelimit",
        "7000",
        "-splitParallelInitialDepth",
        "3",
        "-numOfParallelSplits",
        "7"
    ],
    "smt_timeout": 1800
}
